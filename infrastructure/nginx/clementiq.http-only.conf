# Bootstrap config (no TLS) for the first deploy / certificate issuance.
server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location /api/ { proxy_pass http://api:8000; proxy_read_timeout 180s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
}
