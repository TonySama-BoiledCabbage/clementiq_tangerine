name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests (synthetic fixtures + real-data judge fixtures)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace apps/web run typecheck
      - run: npm --workspace apps/web run test
      - run: npm --workspace apps/web run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t clementiq-api .
      - run: docker build -f apps/web/Dockerfile -t clementiq-web .
